[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-intelligence-ax-pilot"
version = "0.1.0"
description = "Evidence-gated autonomous research loop with independent agent reviews"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "langgraph>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
career-ax = "career_ax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
